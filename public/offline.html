<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>Offline · Life RPG</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; color: #f5f2ea; font-family: Impact, "Arial Narrow Bold", sans-serif; }
    body { display: grid; place-items: center; text-align: center; padding: 1rem;
      background-image: radial-gradient(rgba(245,242,234,.07) 1px, transparent 1.4px); background-size: 7px 7px; }
    .tag { display: inline-block; background: #e3172f; padding: .2rem 1rem; letter-spacing: .25em; font-size: .85rem;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
    h1 { margin: 1rem 0; font-size: clamp(3rem, 14vw, 6rem); line-height: .95; text-transform: uppercase; transform: rotate(-3deg); }
    h1 span { background: #f5f2ea; color: #0b0b0d; padding: 0 .4rem; }
    p { font-family: system-ui, sans-serif; color: #a7a3ab; max-width: 22rem; margin: 0 auto 1.5rem; }
    button { font: inherit; letter-spacing: .15em; text-transform: uppercase; background: #e3172f; color: #f5f2ea; border: 0;
      padding: .6rem 1.6rem; cursor: pointer; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
    button:focus-visible { outline: 3px solid #ffd60a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">LIFE RPG</span>
    <h1>No <span>signal</span></h1>
    <p>You're offline. Your progress is safe. Reconnect to keep logging.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
